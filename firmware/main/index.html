<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>OWON VDS1022</title>
<style>
  :root {
    --bg: #0d0f12; --panel: #171a1f; --line: #2b313a; --text: #dde1e7; --muted: #8b929d;
    --accent: #3f7fe8; --ch0: #ffd400; --ch1: #00d4ff;
    --ok: #3fbf6a; --warn: #e0a030; --bad: #e0564a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 8px 8px 24px; background: var(--bg); color: var(--text); font: 15px system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; }
  button, select, input { font: inherit; color: inherit; }
  button, select { min-height: 44px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 0 10px; }
  button { cursor: pointer; touch-action: manipulation; }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled, input:disabled { opacity: 0.4; }

  #topbar { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 4px 2px 8px; }
  #state { padding: 4px 10px; border-radius: 12px; background: var(--line); font-weight: 600; }
  #state[data-state="running"] { background: var(--ok); color: #04210f; }
  #state[data-state="waiting"] { background: var(--warn); color: #2a1a00; }
  #state[data-state="offline"] { background: var(--bad); color: #2a0703; }
  #sample-info, #info { color: var(--muted); font-variant-numeric: tabular-nums; }

  #screen { position: relative; height: min(88vw, 62vh); min-height: 240px; background: #000; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  #screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #trace { touch-action: pan-y; }
  button sub { font-size: 0.65em; line-height: 0; margin-left: 1px; }

  .handle { --hit: 44px; position: absolute; top: 0; z-index: 1; width: var(--hit); height: var(--hit); touch-action: none; }
  @media (pointer: fine) { .handle { --hit: 28px; } }
  .handle[data-handle="level"] { right: 0; cursor: ns-resize; }
  .handle[data-handle="offset"] { left: 0; cursor: ns-resize; }
  .handle[data-handle="position"] { left: 0; cursor: ew-resize; }
  #drag-readout { position: absolute; z-index: 2; padding: 2px 6px; border-radius: 4px; background: #000c; border: 1px solid var(--line); font-variant-numeric: tabular-nums; pointer-events: none; white-space: nowrap; }

  #scale { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 6px 2px; font-variant-numeric: tabular-nums; }
  .c0 { color: var(--ch0); }
  .c1 { color: var(--ch1); }
  #info { min-height: 1.3em; padding: 0 2px 6px; }

  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 4px 0 10px; }
  .row button { font-weight: 600; padding: 0 4px; }
  #run[data-running="true"] { background: var(--bad); border-color: var(--bad); color: #fff; }
  #run[data-running="false"] { background: var(--ok); border-color: var(--ok); color: #04210f; }
  #single[data-armed="true"] { background: var(--warn); border-color: var(--warn); color: #2a1a00; }

  #measures { display: grid; grid-template-columns: auto 1fr 1fr; gap: 2px 14px; padding: 8px 10px; margin-bottom: 10px; background: var(--panel); border-radius: 8px; font-variant-numeric: tabular-nums; }
  #measures .label { color: var(--muted); }
  #measures .value { text-align: right; }

  .groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 10px; }
  .group { background: var(--panel); border-radius: 8px; padding: 10px; display: grid; gap: 8px; align-content: start; }
  .group h2 { margin: 0; font-size: 15px; }
  .group.ch0 h2 { color: var(--ch0); }
  .group.ch1 h2 { color: var(--ch1); }
  .seg { display: flex; gap: 4px; }
  .seg > button { flex: 1; padding: 0 4px; }
  .head { display: flex; align-items: center; justify-content: space-between; }
  .head button { min-width: 4.5em; }
  .stepper { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; gap: 4px; }
  .stepper button { padding: 0; font-size: 20px; }
  .line { display: grid; grid-template-columns: 4.5em minmax(0, 1fr); gap: 8px; align-items: center; }
  .line > span { color: var(--muted); }
  .slider { display: grid; grid-template-columns: 4.5em 1fr 5.5em; gap: 8px; align-items: center; }
  .slider > span { color: var(--muted); }
  .slider output { text-align: right; font-variant-numeric: tabular-nums; }
  input[type="range"] { width: 100%; min-height: 44px; accent-color: var(--accent); }

  footer { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between; margin-top: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  footer a { color: #8ab4f8; }
</style>
</head>
<body>
<main>
  <div id="topbar">
    <span id="state" data-state="offline">No connection</span>
    <span id="sample-info"></span>
  </div>

  <div id="screen">
    <canvas id="grid"></canvas>
    <canvas id="trace"></canvas>
    <div class="handle" data-handle="level" hidden></div>
    <div class="handle" data-handle="position" hidden></div>
    <div class="handle" data-handle="offset" data-channel="0" hidden></div>
    <div class="handle" data-handle="offset" data-channel="1" hidden></div>
    <div id="drag-readout" hidden></div>
  </div>
  <div id="scale"><span id="scale-0" class="c0"></span><span id="scale-1" class="c1"></span><span id="scale-time"></span></div>
  <div id="info"></div>

  <div class="row">
    <button id="run" data-running="true">Stop</button>
    <button id="single" data-armed="false">Single</button>
    <button id="force">Force trig</button>
    <button id="autoset">Autoset</button>
  </div>

  <div id="measures"></div>

  <div class="groups">
    <section class="group ch0">
      <div class="head">
        <h2>CH1</h2>
        <button id="on-0" data-key="settings.channels.0.on" data-toggle>On</button>
      </div>
      <div class="line"><span>Range</span><div class="stepper"><button data-step="settings.channels.0.rangeIndex" data-delta="-1" aria-label="Smaller volts per division">&minus;</button><select aria-label="CH1 volts per division" data-key="settings.channels.0.rangeIndex" data-ranges="0"></select><button data-step="settings.channels.0.rangeIndex" data-delta="1" aria-label="Larger volts per division">+</button></div></div>
      <label class="slider"><span>Position</span><input type="range" min="-0.45" max="0.45" step="0.01" data-key="settings.channels.0.offset"><output data-out="settings.channels.0.offset"></output></label>
      <div class="line"><span>Coupling</span><div class="seg">
        <button data-key="settings.channels.0.coupling" data-value="1">DC</button>
        <button data-key="settings.channels.0.coupling" data-value="0">AC</button>
        <button data-key="settings.channels.0.coupling" data-value="2" title="Display only: the input stays connected">GND<sub>soft</sub></button>
      </div></div>
      <div class="line"><span>Probe</span><div class="seg">
        <button data-key="settings.channels.0.probe" data-value="1">×1</button>
        <button data-key="settings.channels.0.probe" data-value="10">×10</button>
        <button data-key="settings.channels.0.probe" data-value="100">×100</button>
      </div></div>
    </section>

    <section class="group ch1">
      <div class="head">
        <h2>CH2</h2>
        <button id="on-1" data-key="settings.channels.1.on" data-toggle>On</button>
      </div>
      <div class="line"><span>Range</span><div class="stepper"><button data-step="settings.channels.1.rangeIndex" data-delta="-1" aria-label="Smaller volts per division">&minus;</button><select aria-label="CH2 volts per division" data-key="settings.channels.1.rangeIndex" data-ranges="1"></select><button data-step="settings.channels.1.rangeIndex" data-delta="1" aria-label="Larger volts per division">+</button></div></div>
      <label class="slider"><span>Position</span><input type="range" min="-0.45" max="0.45" step="0.01" data-key="settings.channels.1.offset"><output data-out="settings.channels.1.offset"></output></label>
      <div class="line"><span>Coupling</span><div class="seg">
        <button data-key="settings.channels.1.coupling" data-value="1">DC</button>
        <button data-key="settings.channels.1.coupling" data-value="0">AC</button>
        <button data-key="settings.channels.1.coupling" data-value="2" title="Display only: the input stays connected">GND<sub>soft</sub></button>
      </div></div>
      <div class="line"><span>Probe</span><div class="seg">
        <button data-key="settings.channels.1.probe" data-value="1">×1</button>
        <button data-key="settings.channels.1.probe" data-value="10">×10</button>
        <button data-key="settings.channels.1.probe" data-value="100">×100</button>
      </div></div>
    </section>

    <section class="group">
      <h2>Horizontal</h2>
      <div class="line"><span>Time</span><div class="stepper"><button data-step="settings.rateIndex" data-delta="1" aria-label="Less time per division">&minus;</button><select id="time-range" aria-label="Time per division" data-key="settings.rateIndex"></select><button data-step="settings.rateIndex" data-delta="-1" aria-label="More time per division">+</button></div></div>
      <label class="slider"><span>Position</span><input id="position" type="range" min="0" max="1" step="0.01" data-key="settings.trigger.position"><output data-out="settings.trigger.position"></output></label>
      <div class="line"><span>Acquire</span><div class="seg"><button data-key="settings.peak" data-toggle>Peak detect</button></div></div>
    </section>

    <section class="group">
      <h2>Trigger (edge)</h2>
      <div class="line"><span>Mode</span><div class="seg">
        <button data-key="settings.trigger.sweep" data-value="0">Auto</button>
        <button data-key="settings.trigger.sweep" data-value="1">Normal</button>
      </div></div>
      <div class="line"><span>Source</span><div class="seg">
        <button data-key="settings.trigger.source" data-value="0">CH1</button>
        <button data-key="settings.trigger.source" data-value="1">CH2</button>
        <button data-key="settings.trigger.source" data-value="2">EXT</button>
      </div></div>
      <div class="line"><span>Slope</span><div class="seg">
        <button data-key="settings.trigger.fall" data-value="false">Rising</button>
        <button data-key="settings.trigger.fall" data-value="true">Falling</button>
      </div></div>
      <label class="slider"><span>Level</span><input id="level" type="range" min="-5" max="5" step="0.05" data-key="settings.trigger.levelDiv"><output data-out="settings.trigger.levelDiv"></output></label>
      <div class="seg"><button id="level-50">Set level to 50 %</button></div>
    </section>

    <section class="group">
      <h2>View</h2>
      <div class="seg">
        <button data-key="ui.view" data-value='"time"'>Time</button>
        <button data-key="ui.view" data-value='"fft"'>FFT</button>
        <button data-key="ui.view" data-value='"xy"'>XY</button>
      </div>
      <div class="seg">
        <button data-key="ui.cursorsV" data-toggle>V cursors</button>
        <button data-key="ui.cursorsT" data-toggle>T cursors</button>
      </div>
      <div class="seg">
        <button data-key="ui.cursorChannel" data-value="0">Cursor CH1</button>
        <button data-key="ui.cursorChannel" data-value="1">Cursor CH2</button>
      </div>
      <div class="seg"><button id="export">Export CSV</button></div>
    </section>
  </div>

  <footer>
    <span id="stats">-</span>
    <a id="settings" href="/settings">Settings</a>
  </footer>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
