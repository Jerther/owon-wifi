<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OWON VDS1022 settings</title>
<style>
  body { margin: 0; padding: 12px; background: #111; color: #ddd; font: 14px system-ui, sans-serif; }
  a { color: #8ab4f8; }
  section { margin: 16px 0; padding: 12px; background: #1a1a1a; border-radius: 6px; }
  h2 { margin: 0 0 8px; font-size: 16px; }
  input, button { box-sizing: border-box; width: 100%; margin: 4px 0; padding: 10px; font: inherit; color: #ddd; background: #000; border: 1px solid #444; border-radius: 4px; }
  button { background: #2a2a2a; }
  .network { text-align: left; }
  .show { display: block; margin: 8px 0; }
  .show input { width: auto; margin: 0 6px 0 0; }
  pre { margin: 0; height: 40vh; overflow: auto; background: #000; padding: 8px; font-size: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<a href="/">Back to the scope</a>

<section>
  <h2>Status</h2>
  <div id="status">Loading...</div>
</section>

<section>
  <h2>Wi-Fi</h2>
  <button id="scan">Scan again</button>
  <div id="networks"></div>
  <input id="ssid" placeholder="Network name" maxlength="32" autocapitalize="off" autocomplete="off">
  <input id="password" type="password" placeholder="Password" maxlength="63" autocomplete="off">
  <label class="show"><input id="show-password" type="checkbox"> Show password</label>
  <button id="save">Save</button>
  <button id="forget">Forget</button>
  <div id="wifi-result"></div>
</section>

<section>
  <h2>Firmware</h2>
  <input id="firmware" type="file" accept=".bin">
  <button id="upload">Upload</button>
  <div id="update-result"></div>
</section>

<section>
  <h2>Logs</h2>
  <pre id="logs"></pre>
</section>

<script>
const STATUS_PERIOD_MS = 5000;
const FAILURE_NO_NETWORK = 201;
const FAILURES_WRONG_PASSWORD = [2, 15, 202, 204];
const LOGS_PERIOD_MS = 2000;
const RESTART_WAIT_MS = 10000;

const status = document.getElementById('status');
const logs = document.getElementById('logs');
const wifiResult = document.getElementById('wifi-result');
const updateResult = document.getElementById('update-result');
const networksList = document.getElementById('networks');
const ssidInput = document.getElementById('ssid');
const passwordInput = document.getElementById('password');

function describeConnection(info) {
  let description = 'not connected';
  if (info.connected) {
    description = `connected, ${info.ip}`;
  } else if (FAILURES_WRONG_PASSWORD.includes(info.last_failure)) {
    description = 'not connected, check the password';
  } else if (info.last_failure === FAILURE_NO_NETWORK) {
    description = 'not connected, network not found';
  } else if (info.last_failure) {
    description = `not connected, error ${info.last_failure}`;
  }
  return description;
}

async function refreshStatus() {
  try {
    const info = await (await fetch('/status')).json();
    status.textContent = `Firmware ${info.version} (${info.partition})\n` +
      `Own network: ${info.ap_ssid}\n` +
      `Joined network: ${info.sta_ssid || 'none'}, ${describeConnection(info)}`;
  } catch (error) {
    status.textContent = 'Device unreachable';
  }
}

async function refreshLogs() {
  try {
    const stuckToBottom = logs.scrollTop + logs.clientHeight >= logs.scrollHeight - 20;
    logs.textContent = await (await fetch('/logs')).text();
    if (stuckToBottom) {
      logs.scrollTop = logs.scrollHeight;
    }
  } catch (error) {
    // The next poll will try again.
  }
}

function strongestPerName(networks) {
  const strongest = new Map();
  networks.filter((network) => network.ssid).forEach((network) => {
    const known = strongest.get(network.ssid);
    if (!known || network.rssi > known.rssi) {
      strongest.set(network.ssid, network);
    }
  });
  return [...strongest.values()].sort((a, b) => b.rssi - a.rssi);
}

function chooseNetwork(network) {
  ssidInput.value = network.ssid;
  passwordInput.value = '';
  passwordInput.focus();
}

function showNetworks(networks) {
  networksList.replaceChildren(...strongestPerName(networks).map((network) => {
    const button = document.createElement('button');
    button.className = 'network';
    button.textContent = `${network.ssid}${network.secure ? '' : ' (open)'} · ${network.rssi} dBm`;
    button.onclick = () => chooseNetwork(network);
    return button;
  }));
  if (networksList.childElementCount === 0) {
    networksList.textContent = 'No network found';
  }
}

async function scan() {
  networksList.textContent = 'Scanning...';
  try {
    const response = await fetch('/networks');
    if (response.ok) {
      showNetworks(await response.json());
    } else {
      networksList.textContent = 'Scan failed, try again in a moment';
    }
  } catch (error) {
    networksList.textContent = 'Scan failed: device unreachable';
  }
}

async function sendWifi(ssid, password) {
  try {
    const response = await fetch('/wifi', {method: 'POST', body: JSON.stringify({ssid, password})});
    wifiResult.textContent = response.ok ? 'Saved' : `Failed: ${await response.text()}`;
  } catch (error) {
    wifiResult.textContent = 'Failed: device unreachable';
  }
  refreshStatus();
}

async function upload() {
  const file = document.getElementById('firmware').files[0];
  if (!file) {
    updateResult.textContent = 'Choose a .bin file first';
    return;
  }
  updateResult.textContent = 'Uploading...';
  try {
    const response = await fetch('/update', {method: 'POST', body: file});
    updateResult.textContent = response.ok ? 'Done, restarting...' : `Failed: ${await response.text()}`;
  } catch (error) {
    updateResult.textContent = 'Failed: connection lost';
  }
  setTimeout(refreshStatus, RESTART_WAIT_MS);
}

document.getElementById('save').onclick = () => {
  sendWifi(ssidInput.value, passwordInput.value);
};
document.getElementById('forget').onclick = () => sendWifi('', '');
document.getElementById('upload').onclick = upload;
document.getElementById('scan').onclick = scan;
document.getElementById('show-password').onchange = (event) => {
  passwordInput.type = event.target.checked ? 'text' : 'password';
};

status.style.whiteSpace = 'pre-line';
refreshStatus();
refreshLogs();
scan();
setInterval(refreshStatus, STATUS_PERIOD_MS);
setInterval(refreshLogs, LOGS_PERIOD_MS);
</script>
</body>
</html>
